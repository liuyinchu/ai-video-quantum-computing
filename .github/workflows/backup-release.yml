name: Assemble and verify complete project backup
on:
  push:
    branches: [backup/full-snapshot-20261030]
    paths: [backup/manifest.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: full-backup-20261030
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Reassemble, hash-check, extract and verify every original file
        run: node backup/reassemble.mjs
      - name: Publish verified Release attachments
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash backup/publish.sh

